<svg width="1000" height="300" viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00F5FF"/>
      <stop offset="0.5" stop-color="#7B2FF7"/>
      <stop offset="1" stop-color="#FF00C8"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset="1" stop-color="#150a2e"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00F5FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00F5FF" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#00F5FF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7B2FF7" stroke-opacity="0.22" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="type">
      <rect x="0" y="0" height="300" width="0">
        <animate attributeName="width" from="0" to="1000" dur="3.5s" begin="0.5s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="1000" height="300" fill="url(#bg)"/>
  <rect width="1000" height="300" fill="url(#grid)"/>

  <!-- círculos orbitais -->
  <g fill="none" stroke="url(#neon)" stroke-width="1.5" opacity="0.55">
    <circle cx="840" cy="150" r="110">
      <animate attributeName="stroke-dasharray" values="0 700;350 350;0 700" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="840" cy="150" r="75" stroke-dasharray="6 10">
      <animateTransform attributeName="transform" type="rotate" from="0 840 150" to="360 840 150" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle cx="840" cy="150" r="40">
      <animateTransform attributeName="transform" type="rotate" from="360 840 150" to="0 840 150" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>
  <circle cx="840" cy="150" r="8" fill="#00F5FF" filter="url(#glow)">
    <animate attributeName="r" values="6;11;6" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- partículas -->
  <g fill="#00F5FF" opacity="0.8">
    <circle cx="80"  cy="260" r="2"><animate attributeName="cy" values="280;20" dur="6s"  repeatCount="indefinite"/></circle>
    <circle cx="210" cy="280" r="1.5"><animate attributeName="cy" values="300;0"  dur="8s"  repeatCount="indefinite"/></circle>
    <circle cx="390" cy="270" r="2"><animate attributeName="cy" values="290;10" dur="7s"  repeatCount="indefinite"/></circle>
    <circle cx="560" cy="290" r="1.5"><animate attributeName="cy" values="300;0"  dur="9s"  repeatCount="indefinite"/></circle>
    <circle cx="690" cy="260" r="2"><animate attributeName="cy" values="280;20" dur="5.5s" repeatCount="indefinite"/></circle>
  </g>
  <g fill="#FF00C8" opacity="0.8">
    <circle cx="140" cy="290" r="2"><animate attributeName="cy" values="300;0"  dur="7.5s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="260" r="1.5"><animate attributeName="cy" values="280;20" dur="6.5s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="285" r="2"><animate attributeName="cy" values="300;0"  dur="8.5s" repeatCount="indefinite"/></circle>
    <circle cx="620" cy="270" r="1.5"><animate attributeName="cy" values="290;10" dur="6s"  repeatCount="indefinite"/></circle>
  </g>

  <!-- linha de scan -->
  <rect x="0" y="-60" width="1000" height="60" fill="url(#scan)">
    <animate attributeName="y" from="-60" to="300" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- prompt superior -->
  <text x="60" y="70" font-family="'Courier New',Consolas,monospace" font-size="16" fill="#7B2FF7">
    ~/a14770 $ <tspan fill="#00F5FF">sudo iniciar --futuro</tspan>
  </text>

  <!-- nome -->
  <g clip-path="url(#type)">
    <text x="58" y="160" font-family="'Courier New',Consolas,monospace" font-size="86" font-weight="bold"
          fill="url(#neon)" filter="url(#glow)" letter-spacing="6">GIOVANI</text>
  </g>

  <!-- subtítulo -->
  <text x="62" y="205" font-family="'Courier New',Consolas,monospace" font-size="20" fill="#c9d1d9" letter-spacing="2">
    DEV EM FORMAÇÃO  //  JAVA · JAVASCRIPT · IA
  </text>
  <text x="62" y="240" font-family="'Courier New',Consolas,monospace" font-size="15" fill="#8b949e">
    status:
    <tspan fill="#39FF14">● online</tspan>
    <tspan fill="#8b949e">  |  a compilar o futuro</tspan>
    <tspan fill="#00F5FF">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>█
    </tspan>
  </text>

  <!-- molduras -->
  <path d="M10 40 V10 H40" fill="none" stroke="#00F5FF" stroke-width="3"/>
  <path d="M960 10 H990 V40" fill="none" stroke="#FF00C8" stroke-width="3"/>
  <path d="M10 260 V290 H40" fill="none" stroke="#7B2FF7" stroke-width="3"/>
  <path d="M960 290 H990 V260" fill="none" stroke="#00F5FF" stroke-width="3"/>
</svg>
